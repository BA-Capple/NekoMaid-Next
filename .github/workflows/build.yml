name: Build

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set plugin version (from release tag)
        if: github.event_name == 'release'
        run: |
          version='${{ github.ref_name }}'
          version=${version#v}
          sed -i "s/0\.0\.0/${version}/" src/main/resources/plugin.yml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (shadowJar)
        run: ./gradlew shadowJar --no-daemon

      - name: Upload plugin jar to release
        if: github.event_name == 'release'
        run: mv build/libs/NekoMaid-1.0-SNAPSHOT.jar build/libs/NekoMaid.jar

      - name: Attach jar to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/NekoMaid.jar
