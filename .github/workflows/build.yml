name: Build

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [created]

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set plugin version (from release tag)
        if: github.event_name == 'release'
        run: version='${{ github.ref }}' && sed -i "s/0\.0\.0/${version:10}/" src/main/resources/plugin.yml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (shadowJar)
        run: ./gradlew shadowJar --no-daemon

      - name: Upload plugin jar to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/NekoMaid-1.0-SNAPSHOT.jar
