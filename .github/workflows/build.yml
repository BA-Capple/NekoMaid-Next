name: Build

on:
  push:
    branches: [master, 1.21.11]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install panel dependencies
        run: npm ci --legacy-peer-deps --omit=optional --no-audit --no-fund
      - name: Generate Minecraft language resources
        run: |
          set -euo pipefail
          retry=(--retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20)
          curl -fsSL "${retry[@]}" -o /tmp/manifest.json https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
          version_url=$(jq -r '.versions[] | select(.id=="26.2") | .url' /tmp/manifest.json | head -1)
          test -n "$version_url"
          curl -fsSL "${retry[@]}" -o /tmp/version.json "$version_url"
          asset_index_url=$(jq -r '.assetIndex.url' /tmp/version.json)
          curl -fsSL "${retry[@]}" -o /tmp/assets.json "$asset_index_url"
          mkdir -p languages/minecraft
          for language in zh_cn en_gb; do
            hash=$(jq -r --arg path "minecraft/lang/$language.json" '.objects[$path].hash' /tmp/assets.json)
            test -n "$hash" && test "$hash" != null
            curl -fsSL "${retry[@]}" -o "languages/minecraft/$language.json" \
              "https://resources.download.minecraft.net/${hash:0:2}/$hash"
          done
          cp languages/minecraft/en_gb.json languages/minecraft/en_us.json
      - name: Check types
        run: npx tsc --noEmit --emitDeclarationOnly false
      - name: Build panel
        run: npm run build

  build-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install icon generator dependencies
        run: npm ci --legacy-peer-deps --omit=optional --no-audit --no-fund

      - name: Set plugin version (from release tag)
        if: github.event_name == 'release'
        run: |
          version='${{ github.ref_name }}'
          version=${version#v}
          sed -i "s/0\.0\.0/${version}/" src/main/resources/plugin.yml

      # Mojang's block/item textures are intentionally not stored in the repository, but the
      # released jar does ship them, so unpack them into the resource tree before building.
      # Tolerated on failure: the plugin still builds, the panel just loses those icons.
      - name: Fetch Minecraft block/item icons (Mojang assets stay out of the repository)
        continue-on-error: true
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/manifest.json https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
          mc_version=26.2
          if [ "$TARGET_BRANCH" = "1.21.11" ]; then mc_version=1.21.11; fi
          url=$(jq -r --arg version "$mc_version" '.versions[] | select(.id==$version) | .url' /tmp/manifest.json | head -1)
          if [ -z "$url" ]; then
            url=$(jq -r '[.versions[] | select(.type=="release")][0].url' /tmp/manifest.json)
          fi
          client=$(curl -fsSL "$url" | jq -r '.downloads.client.url')
          curl -fsSL -o /tmp/client.jar "$client"
          rm -rf /tmp/mcassets && mkdir -p /tmp/mcassets
          unzip -q -o /tmp/client.jar 'assets/minecraft/textures/item/*' 'assets/minecraft/textures/block/*' -d /tmp/mcassets
          mkdir -p src/main/resources/static/icons/minecraft
          # block first, then item, so an item texture wins where both exist
          cp -rn /tmp/mcassets/assets/minecraft/textures/block/. src/main/resources/static/icons/minecraft/ || true
          cp -r /tmp/mcassets/assets/minecraft/textures/item/. src/main/resources/static/icons/minecraft/ || true
          node scripts/generateMinecraftModelIcons.cjs /tmp/client.jar src/main/resources/static/icons/minecraft /tmp/minecraftIcons.json
          echo "bundled minecraft icons: $(find src/main/resources/static/icons/minecraft -type f | wc -l)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (shadowJar)
        run: ./gradlew shadowJar --no-daemon

      # build.gradle pins the archive name to NekoMaid.jar, so nothing has to be renamed here.
      - name: Show build output
        run: ls -la build/libs/

      - name: Attach jar to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/NekoMaid.jar
